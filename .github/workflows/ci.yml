name: TestGenIQ CI

on:
  push:
  pull_request:

jobs:
  testgeniq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: npm install
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      - run: sleep 3
      - run: python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/openapi.json').status)"
      - run: python -c "import urllib.request; open('openapi.json','wb').write(urllib.request.urlopen('http://127.0.0.1:8000/openapi.json').read())"
      - run: python -m pytest --cov=app --cov=engine --cov-report=term-missing --cov-report=html
      - run: python generate_tests.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: python run_testgeniq.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testgeniq-artifacts
          path: |
            htmlcov/
            artifacts/
            postman/generated_collection.json
